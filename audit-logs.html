<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Laboratory Asset Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div><h2>Laboratory Asset Management</h2><span>Audit Logs</span></div>
    <div><span id="userName">User</span> <span id="userRole">Role</span>
      <button type="button" id="logoutBtn">Logout</button></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <h3>Navigation</h3>
      <a href="dashboard.html">Dashboard</a>
      <a href="equipment.html">Equipment</a>
      <a href="borrowing.html">Borrowing Requests</a>
      <a href="returns.html">Returns</a>
      <a href="maintenance.html">Maintenance</a>
      <a href="audit-logs.html" class="active">Audit Logs</a>
    </aside>
    <main class="main-content">
      <h1>Audit Logs</h1>
      <p>Review recorded actions performed in the system.</p>
      <section class="card">
        <div class="form-group">
          <label for="searchInput">Search logs</label>
          <input id="searchInput" type="search" placeholder="Search action, module, user, description, or ID">
        </div>
        <div class="form-group">
          <label for="moduleFilter">Filter by module</label>
          <select id="moduleFilter">
            <option value="All">All modules</option>
            <option value="Borrowing">Borrowing</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Returns">Returns</option>
            <option value="Equipment">Equipment</option>
            <option value="Authentication">Authentication</option>
          </select>
        </div>
        <p id="recordCount">0 records</p>
        <div class="table-container">
          <table>
            <thead><tr><th>ID</th><th>User</th><th>Action</th><th>Module</th><th>Record ID</th><th>Description</th><th>Date</th></tr></thead>
            <tbody id="auditLogsTableBody"><tr><td colspan="7">Loading audit logs...</td></tr></tbody>
          </table>
        </div>
        <p id="pageMessage" role="status"></p>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/audit-logs.js"></script>
</body>
</html>
